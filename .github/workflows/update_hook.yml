name: Update hook dependency pins

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "7 17 1,11,21 * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: rsb-23/actions/checkout@main
      - uses: rsb-23/actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Install dependencies & update hooks
        run: |
          python -m pip install --upgrade pip
          pip install --group ci
          python update_hooks.py

      - name: Create a PR
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "chore: bump additional_dependencies to latest releases"
          title: "Update hook dependency pins"
          branch: update-hook-versions
          delete-branch: true
