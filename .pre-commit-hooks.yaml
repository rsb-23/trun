- id: ruff-check
  name: ruff check (trun)
  entry: python -m trun ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  additional_dependencies: &ruff
  - "ruff==0.16.10"

- id: ruff-format
  name: ruff format (trun)
  entry: python -m trun ruff format
  language: python
  types_or: [python, pyi, jupyter]
  additional_dependencies: *ruff

- id: black
  name: black (trun)
  entry: python -m trun black
  language: python
  types_or: [python, pyi, jupyter]
  additional_dependencies: ["black==26.10.0"]

- id: isort
  name: isort (trun)
  entry: python -m trun isort
  language: python
  types_or: [python, pyi, jupyter]
  additional_dependencies: ["isort==9.0.2"]

- id: mypy
  name: mypy (trun)
  entry: python -m trun mypy
  language: python
  types_or: [python, pyi, jupyter]
  additional_dependencies: ["mypy==2.4.0"]
